<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>HardRock BAND</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #ffffff;
      --text: #2f3542;
      --text-sub: #747d8c;
      --border: #e4e7eb;
      --header-bg: #f8f9fa;
      
      /* 이미지의 부드러운 파스텔 톤 색상 */
      --btn-ok: #387d5e;      /* 차분한 참석 그린 */
      --btn-no: #b83b33;      /* 차분한 불참 레드 */
      --btn-wait: #4a90e2;    /* 부드러운 미정 블루 */
      --btn-backup: #7e57c2;  /* 백업 퍼플 */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 0 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #2f3542;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    header h1 span { font-size: 1.25rem; }

    #content { flex: 1; overflow-y: auto; padding: 10px 8px 75px 8px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 하단 네비게이션 바 (화이트 톤) */
    nav.tab-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 56px;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }
    .tab-btn {
      background: none; border: none; color: #a4b0be;
      display: flex; flex-direction: column; align-items: center;
      font-size: 0.72rem; gap: 3px; cursor: pointer; flex: 1;
    }
    .tab-btn i { font-size: 1.15rem; }
    .tab-btn.active { color: #2f3542; font-weight: bold; }
    .tab-btn.active i { color: #387d5e; }

    /* 출석부 정돈된 표 스타일 */
    .att-table-wrap {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    table.att-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      text-align: center;
    }
    table.att-table th {
      padding: 9px 2px;
      font-weight: 600;
      color: #57606f;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      background-color: var(--header-bg);
      white-space: nowrap;
    }
    table.att-table td {
      border: 1px solid var(--border);
      padding: 5px 3px;
    }
    /* 파트 구분 빈 줄 스타일 */
    table.att-table tr.separator-row td {
      border: 1px solid var(--border);
      height: 14px;
      background-color: #fafbfc;
      padding: 0;
    }
    .member-name-cell {
      font-weight: 700;
      color: #2f3542;
      font-size: 0.85rem;
      text-align: center;
      white-space: nowrap;
      background-color: #ffffff;
      width: 58px;
    }
    .att-btn {
      display: block;
      width: 100%;
      height: 32px;
      line-height: 32px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.78rem;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      transition: transform 0.08s, opacity 0.08s;
      white-space: nowrap;
    }
    .att-btn:active { transform: scale(0.95); opacity: 0.85; }
    .att-btn.참석 { background-color: var(--btn-ok); }
    .att-btn.불참 { background-color: var(--btn-no); }
    .att-btn.미정 { background-color: var(--btn-wait); }
    .att-btn.백업 { background-color: var(--btn-backup); }

    /* 출석 선택 모달창 */
    #att-modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45); z-index: 1000;
      align-items: center; justify-content: center; padding: 20px;
    }
    .att-modal-card {
      background: #ffffff; border-radius: 14px; width: 100%; max-width: 290px;
      padding: 20px 18px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      animation: popIn 0.15s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-target-name { font-size: 1.15rem; font-weight: 700; color: #2f3542; margin-bottom: 2px; }
    .modal-target-date { font-size: 0.85rem; font-weight: 500; color: #747d8c; margin-bottom: 16px; }
    
    .modal-choice-list { display: flex; flex-direction: column; gap: 8px; }
    .modal-btn {
      width: 100%; height: 42px; border: none; border-radius: 6px;
      font-size: 0.92rem; font-weight: 600; color: #ffffff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-btn:active { transform: scale(0.97); }
    .modal-btn.btn-참석 { background-color: var(--btn-ok); }
    .modal-btn.btn-불참 { background-color: var(--btn-no); }
    .modal-btn.btn-미정 { background-color: var(--btn-wait); }
    .modal-btn.btn-백업 { background-color: var(--btn-backup); }
    .modal-btn.btn-취소 { background-color: #f1f2f6; color: #57606f; margin-top: 4px; }

    /* 악보 탭 */
    .search-box { position: sticky; top: 0; z-index: 10; background: var(--bg); padding-bottom: 10px; max-width: 600px; margin: 0 auto; }
    .search-input {
      width: 100%; padding: 10px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: #f8f9fa;
      color: #2f3542; font-size: 0.9rem; outline: none;
    }
    .song-group {
      background: #ffffff; border-radius: 10px; max-width: 600px; margin: 0 auto 10px auto;
      border: 1px solid var(--border); overflow: hidden;
    }
    .song-header {
      padding: 12px 14px; font-weight: 700; font-size: 0.98rem; color: #2f3542;
      display: flex; justify-content: space-between; align-items: center; background: #f8f9fa;
      border-bottom: 1px solid var(--border);
    }
    .file-list { padding: 4px 14px; display: flex; flex-direction: column; }
    .file-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #f1f2f6; font-size: 0.88rem; color: #2f3542;
    }
    .file-item:last-child { border-bottom: none; }
    .action-btns { display: flex; gap: 6px; }
    .btn {
      padding: 5px 10px; border-radius: 6px; font-size: 0.78rem;
      border: none; cursor: pointer; text-decoration: none; font-weight: 600;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-view { background: #4a90e2; color: #fff; }
    .btn-down { background: #f1f2f6; color: #57606f; border: 1px solid var(--border); }

    /* 공연현황 */
    .gigs-wrap { max-width: 600px; margin: 0 auto; }
    .member-row {
      display: flex; align-items: center; margin-bottom: 8px; gap: 10px;
      background: #f8f9fa; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    }
    .member-name { width: 64px; font-weight: 700; font-size: 0.88rem; color: #2f3542; }
    .bar-wrap { flex: 1; background: #e4e7eb; height: 14px; border-radius: 7px; overflow: hidden; }
    .bar-fill { background: #4a90e2; height: 100%; border-radius: 7px; }
    .score-num { width: 38px; text-align: right; font-weight: 700; color: #2f3542; font-size: 0.88rem; }

    /* 악보 뷰어 모달 */
    #score-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 1000; flex-direction: column;
    }
    #modal-header {
      background: #ffffff; padding: 12px 16px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border);
    }
    #modal-title { font-size: 0.9rem; font-weight: bold; color: #2f3542; }
    #modal-frame { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }

    #loading { text-align: center; padding: 50px 20px; color: var(--text-sub); }
  </style>
</head>
<body>

  <header>
    <h1><span>🎸</span> HardRock 출석부</h1>
    <div></div>
  </header>

  <div id="content">
    <div id="loading"><i class="fa-solid fa-circle-notch fa-spin fa-2x"></i><br><br>출석부를 불러오는 중입니다...</div>

    <!-- 1. 출석부 탭 -->
    <div id="tab-attendance" class="tab-content active">
      <div class="att-table-wrap">
        <div id="attendance-container"></div>
      </div>
    </div>

    <!-- 2. 공연현황 탭 -->
    <div id="tab-gigs" class="tab-content">
      <div class="gigs-wrap" id="gigs-container"></div>
    </div>

    <!-- 3. 악보 탭 -->
    <div id="tab-scores" class="tab-content">
      <div class="search-box">
        <input type="text" id="score-search" class="search-input" placeholder="🔍 곡명 또는 파트 검색..." oninput="filterScores()">
      </div>
      <div id="scores-container"></div>
    </div>
  </div>

  <!-- 하단 탭 바 -->
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('attendance')">
      <i class="fa-solid fa-calendar-check"></i> 출석부
    </button>
    <button class="tab-btn" onclick="switchTab('gigs')">
      <i class="fa-solid fa-chart-column"></i> 공연현황
    </button>
    <button class="tab-btn" onclick="switchTab('scores')">
      <i class="fa-solid fa-music"></i> 악보
    </button>
  </nav>

  <!-- 출석 선택 모달 -->
  <div id="att-modal-overlay">
    <div class="att-modal-card">
      <div id="modal-user-name" class="modal-target-name">멤버 이름 님</div>
      <div id="modal-date-text" class="modal-target-date">00/00 출석 여부</div>
      
      <div class="modal-choice-list">
        <button class="modal-btn btn-참석" onclick="selectStatus('참석')">참석</button>
        <button class="modal-btn btn-불참" onclick="selectStatus('불참')">불참</button>
        <button class="modal-btn btn-미정" onclick="selectStatus('미정')">미정</button>
        <button class="modal-btn btn-백업" onclick="selectStatus('백업')">백업</button>
        <button class="modal-btn btn-취소" onclick="closeAttModal()">취소</button>
      </div>
    </div>
  </div>

  <!-- 악보 인앱 뷰어 모달 -->
  <div id="score-modal">
    <div id="modal-header">
      <span id="modal-title"></span>
      <button onclick="closeModal()" style="background:#f1f2f6; border:1px solid var(--border); color:#2f3542; padding:5px 12px; border-radius:6px; font-weight:600; cursor:pointer;">닫기</button>
    </div>
    <iframe id="modal-frame" src=""></iframe>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxk46VNnAZtti3FtD2iMVPO9aPIohyoyLTI3cIegGl4jHXN8fyYSMU8QrAX47wpvt6c/exec";

    let appData = { attendance: [], gigs: [], scores: [] };
    let currentEditTarget = null;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW Fail:', err));
    }

    window.onload = function() {
      loadData();
    };

    async function loadData() {
      try {
        const response = await fetch(`${GAS_API_URL}?action=getData&_t=${Date.now()}`, {
          method: 'GET',
          redirect: 'follow',
          headers: { 'Accept': 'application/json' }
        });
        const data = await response.json();
        renderAll(data);
      } catch (err) {
        setTimeout(async () => {
          try {
            const res2 = await fetch(`${GAS_API_URL}?action=getData&_t=${Date.now()}`, { method: 'GET', redirect: 'follow' });
            const data2 = await res2.json();
            renderAll(data2);
          } catch(e) {
            document.getElementById('loading').innerHTML = '⚠️ 로딩 실패: 네트워크를 확인해 주세요.';
          }
        }, 1200);
      }
    }

    function renderAll(res) {
      if (!res || !res.success) {
        document.getElementById('loading').innerHTML = '⚠️ 데이터 오류: ' + (res ? res.error : '응답 없음');
        return;
      }
      appData = res;
      document.getElementById('loading').style.display = 'none';
      renderAttendance();
      renderScores();
      renderGigs();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      const idx = tabId === 'attendance' ? 0 : (tabId === 'gigs' ? 1 : 2);
      document.querySelectorAll('.tab-btn')[idx].classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    function renderAttendance() {
      const container = document.getElementById('attendance-container');
      if (!appData.attendance || appData.attendance.length === 0) {
        container.innerHTML = '<div style="padding:20px; color:#57606f;">출석부 데이터가 비어 있습니다.</div>';
        return;
      }

      const rows = appData.attendance;
      const colCount = rows[0].length;
      let html = '<table class="att-table">';
      
      // 헤더 날짜 렌더링
      html += '<thead><tr>';
      rows[0].forEach((header, colIdx) => {
        html += `<th class="${colIdx === 0 ? 'member-name-cell' : ''}">${header}</th>`;
      });
      html += '</tr></thead><tbody>';

      for (let r = 1; r < rows.length; r++) {
        const memberName = (rows[r][0] || '').trim();
        
        // 이름이 비어 있는 행은 파트 구분용 빈 줄로 처리
        if (!memberName) {
          html += `<tr class="separator-row"><td colspan="${colCount}"></td></tr>`;
          continue;
        }

        html += '<tr>';
        for (let c = 0; c < rows[r].length; c++) {
          const val = (rows[r][c] || '').trim();
          if (c === 0) {
            html += `<td class="member-name-cell">${val}</td>`;
          } else {
            const dateHeader = rows[0][c] || '';
            const rowCoord = r + 1;
            const colCoord = c + 1;
            const statusClass = normalizeStatus(val);
            const displayText = val === '' ? '미정' : val;

            html += `<td>
              <span class="att-btn ${statusClass}" id="cell_${rowCoord}_${colCoord}"
                    onclick="openAttModal(${rowCoord}, ${colCoord}, '${memberName}', '${dateHeader}')">
                ${displayText}
              </span>
            </td>`;
          }
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function normalizeStatus(val) {
      if (val === '참석' || val === 'O') return '참석';
      if (val === '불참' || val === 'X') return '불참';
      if (val === '백업') return '백업';
      return '미정';
    }

    function openAttModal(row, col, name, date) {
      currentEditTarget = { row, col, name, date };
      document.getElementById('modal-user-name').innerText = `${name} 님`;
      document.getElementById('modal-date-text').innerText = `${date} 출석 여부`;
      document.getElementById('att-modal-overlay').style.display = 'flex';
    }

    function closeAttModal() {
      document.getElementById('att-modal-overlay').style.display = 'none';
      currentEditTarget = null;
    }

    function selectStatus(status) {
      if (!currentEditTarget) return;

      const { row, col } = currentEditTarget;
      const cell = document.getElementById(`cell_${row}_${col}`);
      
      cell.innerText = status;
      cell.className = `att-btn ${status}`;
      closeAttModal();

      fetch(`${GAS_API_URL}?action=updateAttendance&row=${row}&col=${col}&status=${encodeURIComponent(status)}&_t=${Date.now()}`, {
        method: 'GET',
        mode: 'no-cors'
      }).catch(err => console.log('Update Error:', err));
    }

    function renderScores() {
      const container = document.getElementById('scores-container');
      const query = document.getElementById('score-search').value.toLowerCase().trim();
      container.innerHTML = '';

      const groups = {};
      appData.scores.forEach(row => {
        const [song, part, preview, download] = row;
        if (!song) return;
        if (query && !song.toLowerCase().includes(query) && !part.toLowerCase().includes(query)) return;
        
        if (!groups[song]) groups[song] = [];
        groups[song].push({ part, preview, download });
      });

      const songNames = Object.keys(groups).sort();
      if (songNames.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-sub);">악보가 없거나 검색 결과가 없습니다.</div>';
        return;
      }

      songNames.forEach(song => {
        const groupEl = document.createElement('div');
        groupEl.className = 'song-group';
        
        let filesHtml = groups[song].map(f => `
          <div class="file-item">
            <span style="font-weight:600;">${f.part}</span>
            <div class="action-btns">
              <button class="btn btn-view" onclick="openScore('${f.preview}', '${song} - ${f.part}')"><i class="fa-solid fa-eye"></i> 열기</button>
              <a class="btn btn-down" href="${f.download}" target="_blank"><i class="fa-solid fa-download"></i> 받기</a>
            </div>
          </div>
        `).join('');

        groupEl.innerHTML = `
          <div class="song-header">
            <span>🎸 ${song}</span>
            <span style="font-size:0.8rem; color:var(--text-sub); font-weight:normal;">${groups[song].length}개</span>
          </div>
          <div class="file-list">${filesHtml}</div>
        `;
        container.appendChild(groupEl);
      });
    }

    function filterScores() { renderScores(); }

    function openScore(url, title) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-frame').src = url;
      document.getElementById('score-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-frame').src = '';
      document.getElementById('score-modal').style.display = 'none';
    }

    function renderGigs() {
      const container = document.getElementById('gigs-container');
      container.innerHTML = '';
      if (!appData.gigs || appData.gigs.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-sub);">공연현황 데이터가 비어 있습니다.</div>';
        return;
      }
      
      const maxScore = Math.max(...appData.gigs.map(g => Number(g[1]) || 0), 10);
      appData.gigs.forEach(g => {
        const name = g[0];
        const score = Number(g[1]) || 0;
        const percent = Math.min(100, Math.round((score / maxScore) * 100));

        const row = document.createElement('div');
        row.className = 'member-row';
        row.innerHTML = `
          <div class="member-name">${name}</div>
          <div class="bar-wrap"><div class="bar-fill" style="width: ${percent}%;"></div></div>
          <div class="score-num">${score}회</div>
        `;
        container.appendChild(row);
      });
    }
  </script>
</body>
</html>
